
services:
  db:
    image: postgres:16-alpine
    container_name: ivetmart-db
    restart: always
    environment:
      POSTGRES_DB: ivetmart
      POSTGRES_USER: ivetmart
      POSTGRES_PASSWORD: ivetmart_dev_2026
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivetmart -d ivetmart"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ivetmart-network

  ivetmart-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ivetmart-web
    restart: always
    ports:
      - "8095:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://ivetmart:ivetmart_dev_2026@db:5432/ivetmart
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ivetmart-network

volumes:
  pgdata:

networks:
  ivetmart-network:
    driver: bridge
