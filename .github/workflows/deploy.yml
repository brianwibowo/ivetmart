name: CI/CD Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Quality Gate — Biome Lint Check
        run: bun run lint

      - name: Quality Gate — Run Automated Unit Tests
        run: bun test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 203.175.11.198
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 1. Create Docker network if not existing
            docker network create ivetmart-net || true

            # 2. Check & auto-create Postgres DB container with PERSISTENT NAMED VOLUME
            if ! docker ps -a --format '{{.Names}}' | grep -q '^ivetmart-db$'; then
              docker run -d \
                --name ivetmart-db \
                --restart always \
                --network ivetmart-net \
                -v ivetmart_pgdata:/var/lib/postgresql/data \
                -e POSTGRES_USER=postgres \
                -e POSTGRES_PASSWORD=ivetmart_db_password_2026 \
                -e POSTGRES_DB=ivetmart \
                postgres:16-alpine
              sleep 5
            elif ! docker ps --format '{{.Names}}' | grep -q '^ivetmart-db$'; then
              docker start ivetmart-db
              sleep 3
            fi

            # 3. Pull latest image & restart web container
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop ivetmart-web || true
            docker rm ivetmart-web || true

            printf "NODE_ENV=production\nPORT=3000\nHOSTNAME=0.0.0.0\nDATABASE_URL=postgresql://postgres:ivetmart_db_password_2026@ivetmart-db:5432/ivetmart\nBETTER_AUTH_SECRET=ivetmart_secret_key_change_me_32chars\nBETTER_AUTH_URL=https://techno-ivetmart.id\nNEXT_PUBLIC_URL=https://techno-ivetmart.id\nYNS_API_KEY=test_key\n" > /root/ivetmart.env

            docker run -d \
              --name ivetmart-web \
              --restart always \
              --network ivetmart-net \
              -p 8095:3000 \
              --env-file /root/ivetmart.env \
              ghcr.io/${{ github.repository }}:latest

            # 4. Auto-push database schema & seed initial data inside container
            sleep 5
            docker exec ivetmart-web bun run db:push --force || true
            docker exec ivetmart-web bun run db:seed || true

            # Clean dangling images only (preserve volumes)
            docker image prune -f
