name: CI/CD Deploy to Server

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 203.175.11.198
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 1. Pastikan Docker Network ada
            docker network create ivetmart-net || true

            # 2. Buat file /root/ivetmart.env HANYA JIKA BELUM ADA (1x setup saja)
            if [ ! -f /root/ivetmart.env ]; then
              printf "NODE_ENV=production\nPORT=3000\nHOSTNAME=0.0.0.0\nDATABASE_URL=postgresql://postgres:ivetmart_db_password_2026@ivetmart-db:5432/ivetmart\nBETTER_AUTH_SECRET=ivetmart_secret_key_change_me_32chars\nBETTER_AUTH_URL=https://techno-ivetmart.id\nNEXT_PUBLIC_URL=https://techno-ivetmart.id\nYNS_API_KEY=test_key\n" > /root/ivetmart.env
            fi

            # 3. Pull image web terbaru & restart container web
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop ivetmart-web || true
            docker rm ivetmart-web || true

            docker run -d \
              --name ivetmart-web \
              --restart always \
              --network ivetmart-net \
              -p 8095:3000 \
              --env-file /root/ivetmart.env \
              ghcr.io/${{ github.repository }}:latest

            # 4. Sinkronisasi skema DB baru jika ada perubahan tabel (Aman untuk data prod)
            sleep 5
            docker exec ivetmart-web bun run db:push || true

            # Clean up docker images gantung
            docker system prune -f
